# =============================================================================
# reticulate-gpu2 — SLIM conda env to RUN the preadapt-v2 experiment.
#
# This is the Python-only stack the trainer + extractor + d90 + posthoc actually
# import (torch/torchvision/timm/numpy/pandas/pyarrow/scikit-learn/scipy/zarr/pillow).
# The full dev env on the guralnick side ALSO carries an R + RStudio + tidymodels
# stack and Claude tooling — NONE of that is needed to run the experiment, and the
# pinned `rstudio-desktop` + `pkgs/r` channel + a phantom `cuda-toolkit=12.4` (the
# real torch is the conda-forge cuda118 build) are what make the kitchen-sink export
# UNSOLVABLE on a fresh allocation. Keep this file slim.
#
# CREATE IT:
#     mamba env create -f xAI/environment.yml
#     mamba activate reticulate-gpu2
#
# ⚠️ LOGIN-NODE GOTCHA: pytorch here is a CUDA build, so the solver demands the
#    `__cuda` virtual package. On a CPU-only LOGIN node that package is missing and
#    `mamba env create` fails with "__cuda ... missing on the system". Either build
#    the env from inside a GPU job, OR tell conda to assume CUDA is present:
#        CONDA_OVERRIDE_CUDA="11.8" mamba env create -f xAI/environment.yml
#    (This is a solve-time override only; at runtime the real GPU is used.)
#
# Versions match the known-good guralnick env (torch 2.5.1 conda-forge cuda118 build);
# minor packages (timm, scikit-learn) float within their series.
# =============================================================================
name: reticulate-gpu2
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pytorch=2.5.1=cuda118*       # conda-forge CUDA-11.8 build (the build the working env actually uses)
  - torchvision=0.20.1
  - timm
  - numpy=2.2.*
  - pandas
  - pyarrow
  - scikit-learn
  - scipy
  - zarr
  - pillow
  - pip
  - pip:
      - huggingface-hub          # timm uses it to pull MAE/ImageNet ViT-L weights from the Hub
      - hf-xet                   # faster Hub downloads (optional)
      - gdown                    # migration_setup.sh uses it to fetch the PlantCLEF .pth
